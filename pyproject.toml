[project]
name = "practica-2-http-autenticada"
version = "0.1.0"
description = "Consulta a Gemini y API Python con Bearer token para el Bloque 4 de Skillnest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "uvicorn>=0.30,<1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx2>=2.13.1",
    "ruff>=0.17.0",
    "types-requests>=2.33.0.20261006",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
